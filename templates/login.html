{% extends "base.html" %}
{% block title %}Login — Study Planner{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card" id="login-card">
        <div class="auth-header">
            <span class="auth-icon">📚</span>
            <h1>Welcome Back</h1>
            <p class="auth-subtitle">Log in to your Study Planner</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="auth-form" id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="btn-login">Sign In</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('register') }}" id="link-register">Sign up</a></p>
        </div>
    </div>
</div>
{% endblock %}
