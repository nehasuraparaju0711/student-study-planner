{% extends "base.html" %}
{% block title %}Register — Study Planner{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card" id="register-card">
        <div class="auth-header">
            <span class="auth-icon">🚀</span>
            <h1>Create Account</h1>
            <p class="auth-subtitle">Start planning smarter today</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" class="auth-form" id="register-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required minlength="6" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="btn-register">Create Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('login') }}" id="link-login">Sign in</a></p>
        </div>
    </div>
</div>
{% endblock %}
